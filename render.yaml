# Render Postgres database resources do not support rootDir or environment groups.
# The web and cron services below both use the shared group and the database URL.
# Render also disallows sync:false inside groups, so secret prompts are set on each service.
envVarGroups:
  - name: the-docket-shared
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: MAILCHIMP_REPLY_TO
        value: thedocketrepository@outlook.com
      - key: OWNER_NOTIFICATION_EMAIL
        value: thedocketrepository@outlook.com
      - key: EMAIL_PORT
        value: "587"
      - key: PYTHON_VERSION
        value: "3.13.3"

services:
  - type: web
    name: the-docket-web
    runtime: python
    rootDir: the_docket
    buildCommand: ./build.sh
    startCommand: gunicorn docket.wsgi:application
    # TODO: choose a paid web service plan in Render; plan intentionally omitted.
    envVars:
      - fromGroup: the-docket-shared
      - key: DATABASE_URL
        fromDatabase:
          name: the-docket-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: MAILCHIMP_API_KEY
        sync: false
      - key: MAILCHIMP_AUDIENCE_ID
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WAGTAILADMIN_BASE_URL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: cron
    name: the-docket-monthly-digest
    runtime: python
    rootDir: the_docket
    buildCommand: ./build.sh
    startCommand: python manage.py create_monthly_digest
    schedule: "0 3 1 * *"
    # TODO: choose a paid cron plan in Render; plan intentionally omitted.
    envVars:
      - fromGroup: the-docket-shared
      - key: DATABASE_URL
        fromDatabase:
          name: the-docket-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: MAILCHIMP_API_KEY
        sync: false
      - key: MAILCHIMP_AUDIENCE_ID
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WAGTAILADMIN_BASE_URL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

databases:
  # Render's free Postgres may expire; check Render's current terms before choosing a plan.
  # TODO: choose a paid Postgres plan if needed; plan intentionally omitted.
  - name: the-docket-db
    databaseName: the_docket
    user: the_docket
